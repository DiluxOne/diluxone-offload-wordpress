    fingerprint: f2c48f5cec34
    reason: "Interpolates only the plugin's own table name, $wpdb->prefix and a constant; the query has no other variable part."
  - file: includes/class-diluxone-offload-plugin-enhanced.php
    sniff: WordPress.DB.PreparedSQL.InterpolatedNotPrepared
    fingerprint: 19ce68fb82ba
    reason: "Interpolates only the plugin's own table name, $wpdb->prefix and a constant; the query has no other variable part."
  - file: includes/class-diluxone-offload-sync-manager.php
    sniff: WordPress.WP.AlternativeFunctions.curl_curl_multi_init
    fingerprint: 1d0d16135be4
    reason: "Runs many uploads and downloads in parallel with curl_multi, streaming each body from or to disk; the WordPress HTTP API has no parallel requests and no streamed request body. The SQL in this file targets only the plugin's own table, named from $wpdb->prefix and a constant, with values as prepare() placeholders."
  - file: includes/class-diluxone-offload-sync-manager.php
    sniff: WordPress.WP.AlternativeFunctions.rename_rename
    fingerprint: 2d3770348ec7
    reason: "Moves the finished download from its .part file onto the attachment's own path under uploads/, both resolved by WordPress for that attachment; WP_Filesystem has no atomic rename for a local file."
  - file: includes/providers/class-azure-provider.php
    sniff: WordPress.WP.AlternativeFunctions.curl_curl_init
    fingerprint: c5b041c40d2a
    reason: "Talks to the Azure Blob REST API with cURL: the WordPress HTTP API cannot stream a request body from a file, which a large upload needs to stay out of memory; the file functions read that local file or a temporary one."
  - file: includes/providers/class-s3-compatible-provider.php
    sniff: WordPress.WP.AlternativeFunctions.curl_curl_init
    fingerprint: 96aae653e00e
    reason: "Talks to the S3 REST API with cURL: the WordPress HTTP API cannot stream a request body from a file, which a large upload needs to stay out of memory; the file functions read that local file or a temporary one."
  - file: includes/providers/trait-part-upload.php
    sniff: WordPress.WP.AlternativeFunctions.curl_curl_setopt_array
    fingerprint: f352d7e13d73
    reason: "Streams one part of a chunked upload from the local file into a cURL handle at its offset, so a part never sits in memory; the WordPress HTTP API cannot stream a request body."
  - file: uninstall.php
    sniff: WordPress.DB.PreparedSQL.InterpolatedNotPrepared
    fingerprint: 959a3f849395
    reason: "Drops the plugin's own table on uninstall; the name is $wpdb->prefix and a constant, not input."
