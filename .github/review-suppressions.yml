# Every nonce, sanitising, SQL and filesystem check this plugin suppresses with a
# phpcs comment, with why that line is safe in its own terms. Plugin Check
# honours the comment; the wordpress.org reviewer reads the line without it,
# so the kind's suppression-unlisted rule (DiluxOne/.github, kinds/
# wordpress-plugin) fails a suppression that is not listed here. A changed
# line changes its fingerprint and the entry has to be reviewed again.
suppressions:
  - file: includes/class-diluxone-offload-admin.php
    sniff: WordPress.Security.NonceVerification.Recommended
    fingerprint: 787448f80541
    reason: "Which admin page and tab to draw: both are sanitize_key()'d and compared with the plugin's own list of pages and tabs; nothing is saved and nothing is printed from them."
  - file: includes/class-diluxone-offload-admin.php
    sniff: WordPress.Security.NonceVerification.Recommended
    fingerprint: c3ec5d2515b4
    reason: "Redirects an old ?tab= link to the page that replaced it: the value is sanitize_key()'d and only looked up in a fixed map of old tab names; nothing is saved or printed from it."
  - file: includes/class-diluxone-offload-admin.php
    sniff: WordPress.Security.ValidatedSanitizedInput.InputNotSanitized
    fingerprint: 291ec2543107
    reason: "Only tested with is_scalar() so an array becomes an empty string; the value itself is unslashed and sanitized on the next line before it is used. This same function verifies the nonce and manage_options before it reads $_POST."
  - file: includes/class-diluxone-offload-cloud-stream-wrapper.php
    sniff: WordPress.WP.AlternativeFunctions.file_system_operations_fopen
    fingerprint: fe0dc00f56a9
    reason: "This file is the plugin's PHP stream wrapper: fopen, fread, fwrite, fclose and file_get_contents here operate on the wrapper's local temporary buffer file, and WP_Filesystem cannot implement the stream wrapper protocol."
  - file: includes/class-diluxone-offload-db.php
    sniff: WordPress.DB.PreparedSQL.NotPrepared
    fingerprint: 570d9ed25d99
    reason: "The plugin's own table (wp_diluxone_offload_files): every interpolated identifier is the table name built from $wpdb->prefix and a constant, and every value goes through $wpdb->prepare() placeholders."
  - file: includes/class-diluxone-offload-db.php
    sniff: WordPress.DB.PreparedSQL.NotPrepared
    fingerprint: 44a5429c4dd1
    reason: "The query is a fixed string with only the plugin's own table name, from $wpdb->prefix and a constant; the one value, the limit, is the %d placeholder of this prepare()."
  - file: includes/class-diluxone-offload-image-editor-gd.php
    sniff: WordPress.WP.AlternativeFunctions.unlink_unlink
    fingerprint: 9dcc95554590
    reason: "Deletes the temporary file the GD editor created in get_temp_dir() to work on a cloud image; never a file under uploads/ and never a path from input."
  - file: includes/class-diluxone-offload-image-editor-imagick.php
    sniff: WordPress.WP.AlternativeFunctions.unlink_unlink
    fingerprint: 9dcc95554590
    reason: "Deletes the temporary file the Imagick editor created in get_temp_dir() to work on a cloud image; never a file under uploads/ and never a path from input."
  - file: includes/class-diluxone-offload-plugin-enhanced.php
    sniff: WordPress.DB.PreparedSQL.InterpolatedNotPrepared
    fingerprint: 0a77bdca0ce6
    reason: "Interpolates only the plugin's own table name, from $wpdb->prefix and a constant; the file path is the %s placeholder of prepare()."
  - file: includes/class-diluxone-offload-plugin-enhanced.php
    sniff: WordPress.DB.PreparedSQL.InterpolatedNotPrepared
    fingerprint: f6aaccdfbf9a
    reason: "Interpolates only the plugin's own table name, from $wpdb->prefix and a constant; the query has no other variable part."
