name: Release

# Publishes DiluxOne Offload to wordpress.org as a deployment the maintainer
# approves, through the shared workflow in DiluxOne/.github: every push to
# main uploads a development build (the shipped tree stamped <next>-dev.<N>)
# and computes the next version from the type:* labels of what merged. While
# the newest changelog entry of readme.txt starts with the line `Unreleased.`
# the version is not ready and nothing waits; once a pull request removed
# that line, the job waits for approval in the environment `wordpress-org`,
# then stamps, deploys, tags and creates the release. A tag X.Y.Z an
# administrator pushes by hand goes through the same job and must be that
# computed version. Release tags are permanent: a failed deploy is fixed and
# re-run, never re-tagged. See docs/release.md.

on:
  push:
    branches: [main]
    # X.Y.Z tags only: an administrator's, or the release App's.
    tags: ['[0-9]+.[0-9]+.[0-9]+']

# The SVN credentials and the release App's key live in the environment
# `wordpress-org` (Settings › Environments), which the shared workflow's
# release job runs in. A called workflow only sees the secrets its caller
# hands over, and an environment's secrets can only be handed over with
# `secrets: inherit`, which passes every repository and organisation secret
# too (the Anthropic key, the bot's key, the Azure test account). That is why
# this workflow runs only on main and on X.Y.Z tags (never on a pull request
# or a branch: the version job must run on every push to main, so every push
# to main carries them) and calls the shared workflow at a fixed commit: what
# runs with all those secrets is exactly the reviewed code at that commit. A Dependabot bump of that pin is a
# secret-bearing change and is reviewed as one (`.github/**` is high risk).
#
# The shared workflow is pinned to a commit, not to the moving `v2` tag:
# this is the one workflow that runs with the publishing credentials, and
# what it does must not change under it without a pull request here.
# Dependabot keeps the pin current.

permissions:
  contents: write
  pull-requests: read # the labels of what merged decide the version

jobs:
  release:
    uses: DiluxOne/.github/.github/workflows/plugin-release-wp.yml@789913f46f0cba8762cc1a898bb107beb34abfe2 # v2.0.1
    with:
      slug: diluxone-offload
      version-constant: DILUXONE_OFFLOAD_VERSION
      # Rehearsed on 2026-09-26 (run 36250947147, approved, "Rehearsal of
      # 2.0.0"); since then an approval publishes. Set to true to rehearse a
      # change to the pipeline: everything but the SVN commit, the tag and
      # the release, with the notes in the summary.
      dry-run: false
    secrets: inherit
