name: Pull request

# Every check a change to DiluxOne Offload goes through, from the shared
# workflows in DiluxOne/.github: conventions, the fast quality gates, the
# slow wp-env suites and the real-storage suites (this repository's own
# tests-real-azure.yml and tests-real-s3.yml, called from here), then the
# Claude review and the auto-merge decision once they all passed. CodeQL
# (codeql.yml) is this repository's own too.
#
# Nothing runs twice for one change: an edit of the title or description is
# handled by pull-request-edited.yml (no suites), and a push to main runs the
# suites only when its tree is not the one the pull request's checks ran on.
# Once a week, and on the Run workflow button, everything runs against
# today's WordPress and tools; a scheduled failure opens one ci:weekly issue.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conventions:
    permissions:
      contents: read
      pull-requests: read # the pull request's timeline, for the base-branch check on `edited`
    uses: DiluxOne/.github/.github/workflows/conventions.yml@v2
    with:
      retired-names: 'offload\+|offload plus|dilux cloud|dilux-cloud-storage|offload-dlx|dilux one cloud|DILUX_CS_'

  checks:
    permissions:
      contents: read
      pull-requests: read # the push to main looks up the pull request it came from
      checks: read # and the checks of its head
    uses: DiluxOne/.github/.github/workflows/plugin-checks-wp.yml@v2
    with:
      slug: diluxone-offload
      version-constant: DILUXONE_OFFLOAD_VERSION

  tests:
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: DiluxOne/.github/.github/workflows/plugin-tests-wp.yml@v2

  # The real-storage suites, this repository's own workflows, called here so
  # the review can wait for them. Each decides inside whether it runs (code
  # changed; keys only on this repository's own non-draft, non-Dependabot
  # pull requests), so a skipped one does not hold the review back.
  real-azure:
    # Pull requests into main only, as the suite's own trigger had it.
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read # the suite's change detection reads the checks of a merged head
    uses: ./.github/workflows/tests-real-azure.yml
    secrets: inherit

  real-s3:
    # Pull requests into main only, as the suite's own trigger had it.
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read # the suite's change detection reads the checks of a merged head
    uses: ./.github/workflows/tests-real-s3.yml
    secrets: inherit

  # The paid review runs only once every deterministic check passed:
  # conventions, the static checks, the unit, integration and end-to-end
  # suites and the real-storage suites. A suite that skipped itself (a
  # docs-only change, a fork without keys) does not count as a failure.
  review:
    needs: [conventions, checks, tests, real-azure, real-s3]
    if: ${{ !cancelled() && needs.conventions.result == 'success' && needs.checks.result == 'success' && needs.tests.result != 'failure' && needs.real-azure.result != 'failure' && needs.real-s3.result != 'failure' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: DiluxOne/.github/.github/workflows/claude-review.yml@v2
    with:
      profile: plugin-wp
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

  auto-merge:
    needs: review
    if: always() && needs.review.result != 'skipped'
    uses: DiluxOne/.github/.github/workflows/auto-merge.yml@v2
    with:
      risk: ${{ needs.review.outputs.risk }}
      complexity: ${{ needs.review.outputs.complexity }}
      floor: ${{ needs.review.outputs.floor }}
      trusted: ${{ needs.review.outputs.trusted }}
      blocking: ${{ needs.review.outputs.blocking }}
      enabled: ${{ needs.review.outputs.auto-merge }}
      description-ok: ${{ needs.review.outputs.description-ok }}
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

  weekly-failure:
    needs: [checks, tests]
    if: ${{ !cancelled() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      issues: write
    uses: DiluxOne/.github/.github/workflows/weekly-failure.yml@v2
