name: Issues

# What happens to an issue, from the shared workflows in DiluxOne/.github: the
# triage classifies it when it opens (from docs/roadmap.md, the README and
# readme.txt), the reproduction job tries to write a failing unit test when a
# maintainer labels it repro:run, and an issue a person accepts lands on the
# Offload Project. Usage questions go to the wordpress.org forum.

on:
  issues:
    types: [opened, labeled, closed]
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: read

jobs:
  triage:
    permissions:
      contents: read
      issues: write
    uses: DiluxOne/.github/.github/workflows/issue-triage.yml@v5
    with:
      support-url: https://wordpress.org/support/plugin/diluxone-offload/
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

  repro:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: DiluxOne/.github/.github/workflows/issue-repro.yml@v5
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}

  # When a person accepts an issue: it lands on the Offload Project as
  # Accepted, and a pull request opened before gets its gate re-run. When it
  # closes: Done.
  accepted:
    permissions:
      actions: write
      issues: read
      pull-requests: read
    uses: DiluxOne/.github/.github/workflows/issue-accepted.yml@v5
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
