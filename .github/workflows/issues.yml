name: Issues

# What happens to an issue, from the shared workflows in DiluxOne/.github: the
# triage classifies it when it opens (from docs/roadmap.md, the README and
# readme.txt) and the reproduction job tries to write a failing unit test for a
# report the triage calls a bug (repro-triaged), and a maintainer can start one
# by hand with the label repro:run. Usage questions go to the wordpress.org
# forum.

on:
  issues:
    types: [opened, edited, labeled, closed]
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: read

jobs:
  triage:
    permissions:
      contents: read
      issues: write
    uses: DiluxOne/.github/.github/workflows/issue-triage.yml@v7
    with:
      support-url: https://wordpress.org/support/plugin/diluxone-offload/
    secrets: inherit

  repro:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: DiluxOne/.github/.github/workflows/issue-repro.yml@v7
    secrets: inherit

  repro-triaged:
    needs: triage
    if: needs.triage.outputs.bug == 'true'
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: DiluxOne/.github/.github/workflows/issue-repro.yml@v7
    with:
      trigger: triage
      triage-bug: ${{ needs.triage.outputs.bug }}
    secrets: inherit

  # When a person opens or edits an issue not accepted yet: it is checked
  # against the issue schema and labelled awaiting-acceptance or incomplete.
  # When a person accepts an issue: it lands on the Offload Project as
  # Accepted, it is assigned to that person if nobody has it, and a pull
  # request opened before gets its gate re-run; a release issue ("Release
  # X.Y.Z", the Release form) opens its release pull request. When it
  # closes: Done.
  accepted:
    permissions:
      actions: write
      issues: read
      pull-requests: read
    uses: DiluxOne/.github/.github/workflows/issue-accepted.yml@v7
    secrets:
      DILUX_BOT_PRIVATE_KEY: ${{ secrets.DILUX_BOT_PRIVATE_KEY }}
