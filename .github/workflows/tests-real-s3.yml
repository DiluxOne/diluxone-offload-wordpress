          body="$mention the real Cloudflare R2 end-to-end suite failed on \`main\` after ${SHA:0:7}."
          [ "${{ github.event_name }}" = schedule ] && body="$mention the weekly run of the real Cloudflare R2 end-to-end suite failed on \`main\` at ${SHA:0:7}; nothing merged caused it, something drifted."
          body="$body"$'\n\n'"Run: $RUN_URL"
          [ -n "$number" ] && body="$body"$'\n'"Pull request: #$number"
