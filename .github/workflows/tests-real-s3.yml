name: Real-storage suite (S3-compatible)

# The same journeys as the Azure suite, every plugin screen as a user on a
# single site and on a multisite network, against an S3-compatible server:
# a throwaway RustFS (`make s3-up`; MinIO no longer publishes images) on
# wp-env's network, with a bucket per journey created and deleted by the run.
# It needs no secret, so unlike the Azure suite it also runs on drafts and on
# pull requests from forks, whenever the change touches code. Amazon S3 and
# Cloudflare R2 join as targets of their own once their accounts exist
# (docs/plans/2.0.0.md, 2.12).
# A failure on main opens an issue that names the commit, its pull request
# and its author, and comments on that pull request.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch:

concurrency:
  group: real-s3-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  changes:
    name: What changed
    # The organisation's rule, applied to this repository's own workflow:
    # the suite runs on a pull request only when it changes code (the
    # `code` list of the policy, defaults plus .github/review-policy.yml)
    # and on a push to main only when the commit's tree is not the one a
    # merged pull request of this repository already ran it on. The gate
    # below runs on !cancelled() and treats a missing answer as "run", so
    # this job failing never skips the suite.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Runs the central's script from the mutable v2 tag: nothing beyond
    # reading the checkout, whatever the workflow as a whole may write.
    permissions:
      contents: read
      pull-requests: read # the pull request behind a push to main
      checks: read # and the checks of its head
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DiluxOne/.github
          ref: v2
          path: .dx-central
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_POLICY: .dx-central/policy/review-policy.default.yml
        run: bash .dx-central/scripts/changes.sh

  real:
    name: Real S3-compatible end-to-end (single site + network)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # No secret is involved, so forks and drafts run it too; on a pull
    # request or a push only when the What changed job did not rule the code
    # out; the weekly run and the button always run.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.code != 'false') }}
    env:
      REAL_PROVIDER: s3
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-real-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-real-${{ runner.os }}-

      - name: Install Composer dependencies
        # vendor/ is mounted into the wp-env container with the plugin; that
        # is how the container reaches phpunit for the real-provider tests.
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        run: npx wp-env start

      - name: Activate the plugin on the single site
        run: npx wp-env run cli wp plugin activate diluxone-offload-wordpress

      - name: Convert the tests site into a multisite network and network-activate
        run: make env-multisite

      - name: Start the S3-compatible server on wp-env's network
        run: make s3-up

      - name: Run the real-storage suite
        env:
          CI: 'true'
        run: npx playwright test -c playwright.real.config.ts

      - name: Run the real-provider PHPUnit tests
        if: always()
        env:
          CI: 'true'
        run: make test-integration-real

      - name: Upload traces, videos and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: real-s3-results
          path: build/real-results
          retention-days: 14

      - name: Open an issue and notify the pull request when main is broken
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${{ github.repository }}/commits/$SHA/pulls" --jq '.[0]' 2>/dev/null || true)"
          number="$(printf '%s' "$pr" | jq -r '.number // empty')"
          author="$(printf '%s' "$pr" | jq -r '.user.login // empty')"
          mention="@${{ github.repository_owner }}"
          [ -n "$author" ] && [ "$author" != "${{ github.repository_owner }}" ] && mention="$mention @$author"
          title="Real-storage suite (S3) failed on main (${SHA:0:7})"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          body="$mention the real S3-compatible end-to-end suite failed on \`main\` after ${SHA:0:7}."
          [ "${{ github.event_name }}" = schedule ] && body="$mention the weekly run of the real S3-compatible end-to-end suite failed on \`main\` at ${SHA:0:7}; nothing merged caused it, something drifted."
          body="$body"$'\n\n'"Run: $RUN_URL"
          [ -n "$number" ] && body="$body"$'\n'"Pull request: #$number"
          body="$body"$'\n\n'"Traces, videos and screenshots are attached to the run as \`real-s3-results\`."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label bug --assignee "${{ github.repository_owner }}" --body "$body"
          fi
          if [ -n "$number" ]; then
            gh pr comment "$number" --body "This change broke the real-storage suite (S3) on \`main\`: $RUN_URL"
          fi

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop
